name: Release

# Pousser un tag "vX.Y.Z" crée la release GitHub (que HACS propose ensuite en mise à jour).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier que le tag correspond à manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json,glob;print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['version'])")
          echo "Tag: $TAG — manifest: $VER"
          test "$TAG" = "$VER" || { echo "::error::Le tag v$TAG ne correspond pas à la version $VER de manifest.json"; exit 1; }
      - name: Extraire les notes de version du CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version ${GITHUB_REF_NAME}" > notes.md
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
